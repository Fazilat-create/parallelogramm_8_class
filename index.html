<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню документов</title>
    <style>
        /* Немного простых стилей, чтобы выглядело аккуратно */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            display: block;
            text-decoration: none;
            color: #007bff; /* Цвет ссылок как в ГитХабе */
            background-color: #f8f9fa;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: all 0.2s ease;
        }
        a:hover {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        /* Иконка файла перед текстом */
        a::before {
            content: "📄 ";
            margin-right: 8px;
        }
    </style>
</head>
